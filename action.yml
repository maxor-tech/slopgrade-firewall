name: "slopGrade Firewall"
description: "Blocks cross-tenant leaks, injection and secrets a pull request introduces. Source never leaves your runner. Free."
author: "Maxor Global LLC"
branding: { icon: "shield", color: "green" }
inputs:
  firewall-mode:
    description: "gate (DEFAULT — blocks the check on a hard cross-tenant leak OR a blocking security finding (injection/crypto/secrets…), when the repo is entitled: public repos and your first private repo block free on cross-tenant + the 22 OSS classes, a paid slot unlocks every calibrated class; any other repo stays advisory, never blocked ; on a pull request only what the PR introduces counts — pre-existing debt is reported, never blocks) | advisory (reports everything, never blocks) | off. Findings post as an inline PR comment feed when the caller grants `permissions: pull-requests: write`."
    required: false
    default: "gate"
  strict:
    description: "fail CLOSED (exit 1) when no server verdict is available in gate mode, so the control cannot silently self-disable on an outage. Default false (fail open — a network/server incident never breaks the build)."
    required: false
    default: "false"
  upload-sarif:
    description: "upload findings to GitHub Code Scanning (Security tab + inline PR annotations, tracked across commits + dismissible) using YOUR GITHUB_TOKEN — no extra step, no SHA to pin. Needs `permissions: security-events: write` (free on public repos; a private repo also needs GitHub Advanced Security). Fail-soft: without the permission it quietly no-ops, never breaking the build. Default true; set false to disable."
    required: false
    default: "true"
  sarif-file:
    description: "if set, ALSO write the SARIF report to this path (for a build artifact or a manual github/codeql-action/upload-sarif step). The Code Scanning upload above already runs without it. Default empty (no file written)."
    required: false
    default: ""
  deep-scan:
    description: "OPT-IN, paid repos (default false). ALSO sends the SOURCE of the files where a security sink was found (at most 80 files / 2M chars) to slopGrade's hosted taint engine (heisen), which reports proven request→sink flows (injection, SSRF, path traversal, XSS…). The only mode in which code leaves the runner — the default run never sends source. Forwarded then dropped server-side (never logged, never stored). Advisory: findings annotate as warnings, never fail the check. Run with --print-payload to list the files first."
    required: false
    default: "false"
  library-mode:
    description: "OPT-IN (default false; needs deep-scan: \"true\"). For a repo that is a PUBLISHED PACKAGE (detected from package.json / pyproject / setup.py — applications are never affected), also list the taint engine's library-tier candidates — a public function's parameter reaching a sink — as notices to triage. Not proven findings, never blocking: on real CVEs it lifts paired recall from ~1% to ~6-9%, but about 2 in 3 candidates remain after the fix."
    required: false
    default: "false"
  change-review:
    description: "OPT-IN (default false; needs deep-scan: \"true\", pull requests only). ALSO sends the PR's diff hunks (the changed lines + 3 lines of context, at most 64; a new file or a hunk over 40 lines is cut into 40-line windows) to heisen-slop's diff-reading 55M, which lists the changes likely to WEAKEN security — most often a validation check removed, which no taint engine sees. Notices to triage, never blocking. Measured once on held-out real CVEs: 36% of security fixes undone (a check removed) caught at 0.23% false alarms per hunk, and on the commits that really introduced 5,468 CVEs, 19% of commits flagged vs 2.1% of ordinary commits (two detectors served together: removed checks + new vulnerable code). C files (.c/.h; .h is read as C) are read too, scored by a C-only detector: on held-out real C CVE advisories at this 64-hunk cut, the commit that introduced the bug got a notice in 17.3% (on the buggy hunk in 3.3%), vs 2.2% (180 of 8,196) of ordinary C commits. C++ files (.cpp/.cc/.cxx/.hpp/.hh) are read too, scored by a C++-only detector: on unseen C++ CVE advisories, 11.3% (18 of 159) got a notice, vs 1.8% (48 of 2,652) of ordinary C++ commits. Rust files (.rs) are read too, also scored by a Rust-only detector: on unseen Rust CVE advisories, 10% (22 of 214) got a notice, vs 1.8% (108 of 6,107) of ordinary Rust commits. Same rules as deep-scan: paid repos only, canonical origin only, listed by --print-payload."
    required: false
    default: "false"
  deep-scan-block:
    description: "OPT-IN (default false; needs deep-scan: \"true\" and firewall-mode: gate). A NEW deep-scan finding — one no detector pack reported — BLOCKS the check instead of annotating a warning. Measured block precision of the taint engine: ~94% on labeled benchmark code, but at least 78% (25 of 32) on real-world CVE code (about 1 false block in 4-5, mostly project-specific validators it does not recognise); on 52,577 ordinary open-source pull requests it blocked 259, 46 of them for a real flaw — so it stays off unless you choose it."
    required: false
    default: "false"
  fix:
    description: "suggest (DEFAULT) — a finding with a deterministic secure rewrite (TLS verification off, debug on, yaml.load…) gets a GitHub « Commit suggestion » in its inline PR comment, verified in your runner (the finding no longer matches ; nothing leaves) | off."
    required: false
    default: "suggest"
outputs:
  verdict:
    description: "advisory | gate-blocked | gate-unpaid | gate-pass — the exit decision (empty if no server verdict was reached)."
    value: ${{ steps.firewall.outputs.verdict }}
  blocked:
    description: "true if the gate failed the build (a blocking leak/finding in gate mode), false otherwise."
    value: ${{ steps.firewall.outputs.blocked }}
  hard-leaks:
    description: "count of hard cross-tenant leaks in the verdict."
    value: ${{ steps.firewall.outputs.hard-leaks }}
  blocking-findings:
    description: "count of blocking (critical/high) findings the gate counted — on a pull request, only those the PR introduced."
    value: ${{ steps.firewall.outputs.blocking-findings }}
  new-findings:
    description: "on a pull request: findings on the lines the PR added or changed (empty on push runs)."
    value: ${{ steps.firewall.outputs.new-findings }}
  preexisting-blocking:
    description: "on a pull request: blocking findings that already existed — reported, never block the PR (empty on push runs)."
    value: ${{ steps.firewall.outputs.preexisting-blocking }}
  conformance:
    description: "tenant-scoping conformance percent (e.g. 94.2), or empty when not applicable."
    value: ${{ steps.firewall.outputs.conformance }}
  entitled:
    description: "true if the repo is entitled (public free gate OR a paid slot)."
    value: ${{ steps.firewall.outputs.entitled }}
  sarif-uploaded:
    description: "true if findings were uploaded to GitHub Code Scanning this run."
    value: ${{ steps.firewall.outputs.sarif-uploaded }}
runs:
  using: "composite"
  steps:
    # SHA-pinned — we tell consumers to pin our SHA, so we pin our own dependencies too. A mutable @v4 tag would let
    # a compromised tag run arbitrary code in every consumer's runner with their source checked out. (= actions/setup-node v4)
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      if: ${{ inputs.firewall-mode != 'off' }}
      with: { node-version: "22" }
    - name: slopgrade-firewall
      id: firewall
      if: ${{ inputs.firewall-mode != 'off' }}
      shell: bash
      env:
        FW_MODE: ${{ inputs.firewall-mode }}
        FW_STRICT: ${{ inputs.strict }}
        FW_SARIF: ${{ inputs.sarif-file }}
        FW_UPLOAD_SARIF: ${{ inputs.upload-sarif }}
        FW_DEEP_SCAN: ${{ inputs.deep-scan }}
        FW_DEEP_SCAN_BLOCK: ${{ inputs.deep-scan-block }}
        FW_LIBRARY_MODE: ${{ inputs.library-mode }}
        FW_CHANGE_REVIEW: ${{ inputs.change-review }}
        FW_FIX: ${{ inputs.fix }}
        # The caller's OWN GITHUB_TOKEN, used for two consumer-side surfaces, both posting to the caller's OWN repo and
        # never reaching slopGrade: the inline PR comment feed (`permissions: pull-requests: write`) and the Code
        # Scanning SARIF upload (`permissions: security-events: write`). Missing either permission = that surface
        # quietly no-ops; the gate still runs. Empty token on a non-PR run = the PR feed is a no-op.
        GITHUB_TOKEN: ${{ github.token }}
        FW_CLI: ${{ github.action_path }}/isolation-gate.mjs
      run: |
        set -euo pipefail
        # The firewall scans the whole checked-out tree (GITHUB_WORKSPACE = the calling repo). The structural
        # fingerprint is computed LOCALLY (file contents never leave) and posted to the server brain, which
        # classifies + measures. --gate is passed only in 'gate' mode; the server gates the real block via
        # entitlement (public || paid add-on), so 'gate' on a non-entitled repo stays advisory. Fails OPEN by
        # default (a missing OIDC token, timeout, or server error never breaks the build); --strict fails closed.
        # Build argv as an ARRAY (never a word-split string): a consumer who wires an untrusted value into
        # sarif-file (e.g. a PR title) can then never shell-inject in their own runner — each arg is passed intact.
        ARGS=()
        [ "${FW_MODE}" = "gate" ] && ARGS+=(--gate)
        [ "${FW_STRICT}" = "true" ] && ARGS+=(--strict)
        [ -n "${FW_SARIF}" ] && ARGS+=(--sarif "${FW_SARIF}")
        [ "${FW_DEEP_SCAN}" = "true" ] && ARGS+=(--deep-scan)
        [ "${FW_DEEP_SCAN_BLOCK}" = "true" ] && ARGS+=(--deep-scan-block)
        [ "${FW_LIBRARY_MODE}" = "true" ] && ARGS+=(--library-mode)
        [ "${FW_CHANGE_REVIEW}" = "true" ] && ARGS+=(--change-review)
        [ "${FW_FIX}" = "off" ] && ARGS+=(--no-fix)
        node "$FW_CLI" "${ARGS[@]}"
