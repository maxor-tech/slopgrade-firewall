name: slop-gate
on: [pull_request]
jobs:
  slop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ZERO SECRETS: GitHub proves this repo through OIDC → the Firewall resolves your entitlement server-side. Nothing to rotate.
      id-token: write
      # The Firewall posts the verdict as a sticky PR comment (summary + clickable leaks, updated in place) — needs PR write. Missing → it skips cleanly.
      pull-requests: write
      # Sends findings to the Security tab (Code Scanning: inline PR annotations, tracked + dismissible, free on public repos). Missing → it skips cleanly.
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Dogfood : this repo IS the Action, so it runs the checked-out code under review (`./`), not a pinned release.
      # A pinned older release scanned this repo's own detector pattern tables with the patterns a PR is fixing, so a
      # detector fix could never pass its own gate (PR #64, 2026-10-27). Your workflow pins a release SHA instead :
      #   uses: maxor-tech/slopgrade-firewall@<release-sha> # vX.Y.Z
      - uses: ./
        with:
          # gate = blocks on a cross-tenant leak OR a critical/high security finding when the repo is entitled —
          # on a PR, ONLY what the PR introduces (existing debt is reported, never blocks your PR)
          # (free: the cross-tenant gate + the open-source classes block; a paid repo adds the calibrated pro classes, every finding at file:line — see slopGrade /pricing). advisory = reports, never blocks.
          firewall-mode: gate
          # deep-scan: "true"   # OPT-IN (paid repos): sends the source of the files that hold a sink to the hosted taint engine (cross-function flows). The only mode that sends code — see the Action README.
          # deep-scan-block: "true"   # with deep-scan + gate: a NEW deep-scan finding (no pack saw it) fails the check. On real CVEs its blocks are right at least 3 times in 4; on 52,089 ordinary open-source pull requests it blocked 245, 46 of them for a real flaw — off by default.
          # library-mode: "true"   # with deep-scan, published PACKAGE repos only: lists the library-tier candidates (public function parameter → sink) as "to triage" notices. Never blocking; ~2 in 3 remain after the fix.